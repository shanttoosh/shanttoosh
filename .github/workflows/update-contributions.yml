name: Update contribution graph

"on":
  schedule:
    - cron: "17 6 * * *" # ~06:17 UTC (11:47 IST) daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard library only: nothing to install.
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap.py
      - name: Commit if the graph changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contributions.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution graph [skip ci]"
          git push
